name: Windows MPI benchmark preflight

on:
  workflow_dispatch:
  push:
    branches: [codex/canbus-serializable-mpi]
    paths: ['**.py', 'requirements*.txt', 'scripts/verify_windows.ps1', '.github/workflows/windows-benchmark-smoke.yml']
  pull_request:

jobs:
  windows-mpi:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install MS-MPI runtime
        shell: pwsh
        run: |
          try {
            if (-not (Test-Path "$env:WINDIR\System32\msmpi.dll")) {
              $Installer = Join-Path $env:RUNNER_TEMP 'msmpisetup.exe'
              Invoke-WebRequest 'https://github.com/microsoft/Microsoft-MPI/releases/download/v10.1.1/msmpisetup.exe' -OutFile $Installer
              $Install = Start-Process $Installer -ArgumentList '-unattend' -Wait -PassThru
              if ($Install.ExitCode -notin @(0, 3010)) { throw "MS-MPI installer exit code $($Install.ExitCode)" }
            }
            "$env:ProgramFiles\Microsoft MPI\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          } catch {
            Write-Output "::error::$($_.Exception.Message)"
            exit 1
          }
      - name: Install Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          $Output = .\.venv\Scripts\python.exe -m pip install -r requirements-mpi.txt 2>&1
          $Code = $LASTEXITCODE
          $Output | Write-Output
          if ($Code -ne 0) {
            $Message = ($Output | Select-Object -Last 20 | Out-String).Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error::Python dependency installation failed: $Message"
            exit $Code
          }
      - name: Validate Windows protocol benchmarks
        shell: pwsh
        run: .\scripts\verify_windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-mpi-preflight
          path: benchmark-results/preflight
